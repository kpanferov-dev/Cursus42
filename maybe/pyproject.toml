[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained-decoding function calling with small LLMs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0",
    "mypy>=1.0",
    "pytest>=7.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
