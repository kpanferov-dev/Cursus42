# Tooling configuration for the Pac-Man project.
#
# Keeping the excludes here lets the Makefile call the bare `flake8 .` and
# `mypy .` commands required by the subject while still ignoring generated
# build artefacts and the (untyped, third-party) maze package.

[flake8]
max-line-length = 79
extend-exclude =
    .venv,
    venv,
    build,
    dist,
    __pycache__,
    .mypy_cache,
    .pytest_cache

[mypy]
python_version = 3.10
exclude = (^build/|^dist/|^tests/)

# The assigned A-Maze-ing package ships no py.typed marker / stubs.  We use it
# as-is (subject V.4), so we simply tell mypy to trust it.
[mypy-mazegenerator.*]
ignore_missing_imports = True
