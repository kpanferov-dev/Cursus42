[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling via constrained decoding on small LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.8",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "huggingface-hub>=1.15.0",
]



[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["llm_sdk", "tests"]

[tool.flake8]
max-line-length = 100
exclude = ["llm_sdk", ".venv", "__pycache__", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
