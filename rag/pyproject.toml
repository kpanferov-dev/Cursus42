[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "BM25 retrieval + Qwen3 generation RAG over the vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fire>=0.5",
    "tqdm>=4.66",
    "bm25s>=0.2",
    "numpy>=1.24",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "fastembed"
]

[project.optional-dependencies]
# Heavy dependencies needed only for the `answer` / `answer_dataset` commands.
generation = [
    "transformers>=4.51",
    "torch>=2.2",
    "accelerate>=0.30",
]
# Dense semantic retrieval bonus (`index --semantic`, `search --semantic`).
semantic = [
    "model2vec>=0.3",
]
# Cross-encoder reranking bonus (`search_dataset --rerank`), ONNX/torch-free.
rerank = [
    "fastembed>=0.3",
]
dev = [
    "flake8>=7.0",
    "mypy>=1.8",
    "pytest>=8.0",
]

[project.scripts]
student = "student.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "data", ".venv"]

[tool.mypy]
python_version = "3.10"
exclude = ["data/", "build/"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
