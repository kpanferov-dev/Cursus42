[project]
name = "agent-smith"
version = "1.0.0"
description = "Agent Smith: a code agent (Thought -> Code -> Observation) with a secure sandbox and MCP tools"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mcp>=1.22.0,<2",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyflakes>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
sandbox = "smith.sandbox.cli:main"
agent_mbpp = "agent_mbpp.__main__:main"
agent_swebench = "agent_swebench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smith", "agent_mbpp", "agent_swebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
